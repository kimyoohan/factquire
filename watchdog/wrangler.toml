name = "factquire-watchdog"
main = "src/index.js"
compatibility_date = "2026-07-01"

# 0 */4: source-page batches (25 URLs each, 61 total → full sweep ~2x/day)
# 30 22 UTC (= 07:30 KST): daily personalized watchlist alerts from published facts diff
[triggers]
crons = ["0 */4 * * *", "30 22 * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "fb08e1b343de450099bb9a83175b6b06"

# Secrets (set via `wrangler secret put`):
#   RESEND_API_KEY — alert emails
#   RUN_KEY        — manual trigger: GET /run?key=<RUN_KEY>
